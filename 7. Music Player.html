<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Music Player</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 400px; margin: 20px auto; text-align: center; }
  audio { width: 100%; margin-bottom: 10px; }
  button { margin: 5px; padding: 10px 15px; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>

<h1>Music Player</h1>
<audio id="audio" controls></audio>
<br />
<button id="prevBtn">Previous</button>
<button id="playPauseBtn">Play</button>
<button id="nextBtn">Next</button>

<script>
  const playlist = [
    {title: "Song 1", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
    {title: "Song 2", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
    {title: "Song 3", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
  ];
  let currentIndex = 0;

  const audio = document.getElementById('audio');
  const playPauseBtn = document.getElementById('playPauseBtn');

  function loadSong(index) {
    audio.src = playlist[index].src;
    audio.load();
  }

  loadSong(currentIndex);

  playPauseBtn.onclick = () => {
    if(audio.paused) {
      audio.play();
      playPauseBtn.textContent = 'Pause';
    } else {
      audio.pause();
      playPauseBtn.textContent = 'Play';
    }
  };

  document.getElementById('prevBtn').onclick = () => {
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    loadSong(currentIndex);
    audio.play();
    playPauseBtn.textContent = 'Pause';
  };

  document.getElementById('nextBtn').onclick = () => {
    currentIndex = (currentIndex + 1) % playlist.length;
    loadSong(currentIndex);
    audio.play();
    playPauseBtn.textContent = 'Pause';
  };
</script>

</body>
</html>
