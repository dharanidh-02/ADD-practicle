<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
  .question { font-weight: bold; }
  .options { list-style: none; padding: 0; }
  .options li { margin: 8px 0; }
  button { margin-top: 20px; background: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; }
  .result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; }
</style>
</head>
<body>

<h1>Simple Quiz</h1>
<div id="quizContainer"></div>
<button id="submitBtn">Submit</button>
<div id="result" class="result"></div>

<script>
  const quizData = [
    {question: "What is 2 + 2?", options: ["3", "4", "5"], answer: "4"},
    {question: "Capital of France?", options: ["Berlin", "Paris", "London"], answer: "Paris"},
    {question: "Which is a programming language?", options: ["Python", "Snake", "Cobra"], answer: "Python"}
  ];

  const container = document.getElementById('quizContainer');
  const result = document.getElementById('result');
  const submitBtn = document.getElementById('submitBtn');

  quizData.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'question-block';
    let html = `<p class="question">${i+1}. ${q.question}</p><ul class="options">`;
    q.options.forEach(opt => {
      html += `<li><label><input type="radio" name="q${i}" value="${opt}" /> ${opt}</label></li>`;
    });
    html += '</ul>';
    div.innerHTML = html;
    container.appendChild(div);
  });

  submitBtn.onclick = () => {
    let score = 0;
    quizData.forEach((q, i) => {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      if(selected && selected.value === q.answer) score++;
    });
    result.textContent = `You scored ${score} out of ${quizData.length}`;
  };
</script>

</body>
</html>
