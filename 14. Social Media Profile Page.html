<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Social Media Profile</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; }
  h1 { text-align: center; }
  #postForm textarea { width: 100%; height: 60px; padding: 10px; }
  button { margin-top: 10px; padding: 10px; width: 100%; }
  .post { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .timestamp { color: #666; font-size: 0.8rem; }
</style>
</head>
<body>

<h1>Profile</h1>

<form id="postForm">
  <textarea id="postContent" placeholder="What's on your mind?" required></textarea>
  <button type="submit">Post</button>
</form>

<div id="timeline"></div>

<script>
  const postForm = document.getElementById('postForm');
  const timeline = document.getElementById('timeline');

  postForm.onsubmit = e => {
    e.preventDefault();
    const text = document.getElementById('postContent').value.trim();
    if(!text) return;
    const postDiv = document.createElement('div');
    postDiv.classList.add('post');
    const now = new Date();
    postDiv.innerHTML = `
      <p>${text}</p>
      <div class="timestamp">${now.toLocaleString()}</div>
    `;
    timeline.prepend(postDiv);
    postForm.reset();
  };
</script>

</body>
</html>
