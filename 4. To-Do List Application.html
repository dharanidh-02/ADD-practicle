<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>To-Do List</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; }
  input, button { padding: 10px; font-size: 1rem; }
  input { width: 70%; }
  button { width: 25%; background: #4CAF50; color: white; border: none; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { background: #f4f4f4; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
  .edit-btn, .delete-btn { cursor: pointer; margin-left: 10px; color: #555; }
  .edit-btn:hover { color: blue; }
  .delete-btn:hover { color: red; }
</style>
</head>
<body>

<h1>To-Do List</h1>
<input id="taskInput" placeholder="Add new task" />
<button id="addBtn">Add</button>

<ul id="taskList"></ul>

<script>
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('taskList');

  function createTaskItem(text) {
    const li = document.createElement('li');
    li.textContent = text;

    const editBtn = document.createElement('span');
    editBtn.textContent = '✏️';
    editBtn.className = 'edit-btn';
    editBtn.onclick = () => {
      const newText = prompt('Edit task:', li.firstChild.textContent);
      if (newText) li.firstChild.textContent = newText;
    };

    const deleteBtn = document.createElement('span');
    deleteBtn.textContent = '🗑️';
    deleteBtn.className = 'delete-btn';
    deleteBtn.onclick = () => li.remove();

    li.appendChild(editBtn);
    li.appendChild(deleteBtn);
    return li;
  }

  addBtn.onclick = () => {
    const text = input.value.trim();
    if (text) {
      list.appendChild(createTaskItem(text));
      input.value = '';
    }
  };
</script>

</body>
</html>
