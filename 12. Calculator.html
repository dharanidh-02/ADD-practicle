<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculator</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 320px; margin: 20px auto; background: #f3f3f3; padding: 20px; border-radius: 10px; }
  input { width: 100%; height: 50px; font-size: 1.5rem; text-align: right; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
  button { width: 23%; height: 50px; margin: 1%; font-size: 1.2rem; cursor: pointer; border: none; border-radius: 5px; }
  .operator { background: #f39c12; color: white; }
  .equal { background: #27ae60; color: white; width: 48%; }
  .clear { background: #e74c3c; color: white; width: 48%; }
</style>
</head>
<body>

<h1>Calculator</h1>
<input type="text" id="display" readonly />

<div>
  <button onclick="press('7')">7</button>
  <button onclick="press('8')">8</button>
  <button onclick="press('9')">9</button>
  <button class="operator" onclick="press('/')">÷</button>

  <button onclick="press('4')">4</button>
  <button onclick="press('5')">5</button>
  <button onclick="press('6')">6</button>
  <button class="operator" onclick="press('*')">×</button>

  <button onclick="press('1')">1</button>
  <button onclick="press('2')">2</button>
  <button onclick="press('3')">3</button>
  <button class="operator" onclick="press('-')">−</button>

  <button onclick="press('0')">0</button>
  <button onclick="press('.')">.</button>
  <button class="clear" onclick="clearDisplay()">C</button>
  <button class="operator" onclick="press('+')">+</button>

  <button class="equal" onclick="calculate()">=</button>
</div>

<script>
  const display = document.getElementById('display');
  function press(val) {
    display.value += val;
  }
  function clearDisplay() {
    display.value = '';
  }
  function calculate() {
    try {
      display.value = eval(display.value) || '';
    } catch {
      display.value = 'Error';
    }
  }
</script>

</body>
</html>
