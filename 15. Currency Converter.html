<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Currency Converter</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 400px; margin: auto; padding: 20px; }
  h1 { text-align: center; }
  select, input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
  #result { margin-top: 20px; font-weight: bold; font-size: 1.2rem; text-align: center; }
</style>
</head>
<body>

<h1>Currency Converter</h1>

<label>From:</label>
<select id="fromCurrency">
  <option value="USD">USD</option>
  <option value="EUR">EUR</option>
  <option value="INR">INR</option>
  <option value="GBP">GBP</option>
</select>

<label>To:</label>
<select id="toCurrency">
  <option value="INR">INR</option>
  <option value="USD">USD</option>
  <option value="EUR">EUR</option>
  <option value="GBP">GBP</option>
</select>

<label>Amount:</label>
<input type="number" id="amount" placeholder="Enter amount" />

<button id="convertBtn">Convert</button>

<div id="result"></div>

<script>
  const convertBtn = document.getElementById('convertBtn');
  const fromSelect = document.getElementById('fromCurrency');
  const toSelect = document.getElementById('toCurrency');
  const amountInput = document.getElementById('amount');
  const resultDiv = document.getElementById('result');

  convertBtn.onclick = () => {
    const from = fromSelect.value;
    const to = toSelect.value;
    const amount = parseFloat(amountInput.value);
    if (isNaN(amount)) {
      alert('Please enter a valid amount');
      return;
    }

    fetch(`https://api.exchangerate-api.com/v4/latest/${from}`)
      .then(response => response.json())
      .then(data => {
        const rate = data.rates[to];
        if (!rate) {
          resultDiv.textContent = 'Conversion rate not available';
          return;
        }
        const converted = (amount * rate).toFixed(2);
        resultDiv.textContent = `${amount} ${from} = ${converted} ${to}`;
      })
      .catch(() => {
        resultDiv.textContent = 'Failed to fetch exchange rates';
      });
  };
</script>

</body>
</html>
